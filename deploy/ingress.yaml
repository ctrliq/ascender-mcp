# Serves /mcp on the Ascender hostname. The path must match MCP_PATH.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ascender-mcp
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "1800"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ascender.example.com
      secretName: ascender-tls-secret
  rules:
    - host: ascender.example.com
      http:
        paths:
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: ascender-mcp
                port:
                  number: 8080
